<div style="float:left;">
    Alpha Score*:
    <input title="Alpha Score" [(ngModel)]="alphaScore" type="number" min="0.2" max="0.7" step="0.05" />
    <button mat-raised-button class="btn btn-sm ml-1" color="primary"
        [disabled]="!irisDisplayComponent.havePdmResultsReturned" (click)="onApply()">Set</button>
    <button mat-raised-button class="btn btn-sm ml-1 cancel-button" (click)="onClose()">Done</button>
</div>

<div class="pdm-note">
    *Minimum Alpha Score: {{minValue}}<br>
    *Maximum Alpha Score: {{maxValue}}
</div>
