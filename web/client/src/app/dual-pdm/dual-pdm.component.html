<div style="float:left;">
    Set Dual PDM Image
    <button mat-raised-button class="btn btn-sm ml-1" color="primary" matTooltip="Sets this image to the other image" [disabled]="!reviewService.dualPDMReturnedResults || onSetButtonClicked" (click)="onSet()">Set</button>
    <button mat-raised-button class="btn btn-sm ml-1 cancel-button" matTooltip="Undoes the Dual PDM image and exits the mode" [disabled]="!reviewService.dualPDMReturnedResults" (click)="onUnset()">Cancel</button>
</div>
