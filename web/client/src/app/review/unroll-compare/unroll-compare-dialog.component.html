<div mat-dialog-title>
  <div class="dialog-header">&nbsp;
    <h3 class="dialog-title pull-left">Comparison</h3>
    <div class="horizontal-fill"></div>
    <button mat-icon-button color="primary"
            matTooltip="Show/Hide Overlay Options"
            (click)="showOverlayOptions = !showOverlayOptions">
      <mat-icon>settings</mat-icon>
    </button>
    <button mat-icon-button color="primary"
            matTooltip="Close unroll-compare dialog"
            (click)="closeDialog()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <ng-container>
      <p class="text-muted">Images have been colorized to help contrast differences in the overlay pane</p>
      <mat-card appearance="outlined" class="overlay-options" *ngIf="showOverlayOptions">
        <mat-card-content>
          <div>
            <table class="options-table" aria-describedby="Table of Color Options">
              <tr>
                <th colspan="7" scope="header"><p class="text-center">Color Contrast Options</p></th>
              </tr>
              <tr>
                <th colspan="2" scope="col"><p class="text-center">Red/Green</p></th>
                <div></div>
                <th scope="col"><p class="text-center">None</p></th>
                <div></div>
                <th colspan="2" scope="col"><p class="text-center">Blue/Yellow</p></th>
              </tr>
              <tr>
                <td class="option red" (click)="updateOverlay(1)"></td>
                <td class="option green" (click)="updateOverlay(1)"></td>
                <td class="option-space"></td>
                <td class="option gray" (click)="updateOverlay(0)"></td>
                <td class="option-space"></td>
                <td class="option blue" (click)="updateOverlay(2)"></td>
                <td class="option yellow" (click)="updateOverlay(2)"></td>
              </tr>
              <tr>
                <td colspan="7" class="text-center">
                  <br/>
                  Indicate Nearest Point - Select Precision: <select (change)="showClosePoints()"
                                                                     [(ngModel)]="_showClosePoints">
                  <option value="0">Off</option>
                  <option value="10">High</option>
                  <option value="15">Medium</option>
                  <option value="20">Low</option>
                </select>
                </td>
              </tr>
            </table>
          </div>
        </mat-card-content>
      </mat-card>

      <div class="flex">
        <div class="unroll-wrapper text-left">
          <h4>Probe</h4>
          <div [hidden]="probe.loading">
            <app-paper-canvas [width]="probe.width" [height]="probe.height" (canvasInit)="probeInit($event)"></app-paper-canvas>
          </div>
          <p class="text-center text-muted" *ngIf="probe.loading"><i class="fa fa-3x fa-spin fa-circle-o-notch"
                                                                     aria-hidden="true"></i></p>
        </div>
        <div class="unroll-wrapper text-right">
          <h4>Candidate</h4>
          <div [hidden]="candidate.loading">
            <app-paper-canvas [width]="candidate.width" [height]="candidate.height"
                          (canvasInit)="candidateInit($event)"></app-paper-canvas>
          </div>
          <p class="text-center text-muted" *ngIf="candidate.loading"><i class="fa fa-3x fa-spin fa-circle-o-notch"
                                                                         aria-hidden="true"></i></p>
        </div>
      </div>
      <ng-container *ngIf="!probe.loading && !candidate.loading">
        <div class="unroll-container">
          <h4>Overlay</h4>
          <div class="btn-group" data-toggle="buttons">
            <label id="probeAnnotationsLabel" matTooltip="Show/Hide Probe Annotations" class="btn btn-danger">
              <input type="checkbox" autocomplete="off" (click)="showProbeAnnotations()"
                     [checked]="_showProbeAnnotations" [(ngModel)]="_showProbeAnnotations"> Probe
            </label>
            <label id="candidateAnnotationsLabel" matTooltip="Show/Hide Candidate Annotations" class="btn btn-success">
              <input type="checkbox" autocomplete="off" (click)="showCandidateAnnotations()"
                     [checked]="_showCandidateAnnotations" [(ngModel)]="_showCandidateAnnotations"> Candidate
            </label>
          </div>
          <div id="overlay-tools">
            <div class="overlay-button-container">
              <button mat-icon-button color="primary"
                      matTooltip="Move Candidate overlay up"
                      (click)="moveCandidateUp()">
                <mat-icon>keyboard_arrow_up</mat-icon>
              </button>
              <button mat-icon-button color="primary"
                      matTooltip="Move Candidate overlay down"
                      (click)="moveCandidateDown()">
                <mat-icon>keyboard_arrow_down</mat-icon>
              </button>
              <button mat-icon-button color="primary"
                      matTooltip="Reset Position"
                      (click)="resetHeights()">
                <mat-icon>replay</mat-icon>
              </button>
            </div>
            <div class="overlay-canvas-container">
              <app-paper-canvas [width]="overlay.width" [height]="overlay.height"
                            (canvasInit)="overlayInit($event)"></app-paper-canvas>
            </div>
          </div>
          <div class="overlay-slider-container">
            <label id="slider-probe-label">Probe</label>
            <input #range type="range" class="slider" min="0" max="1" step="0.01" [(ngModel)]="slider.value"
                   (ngModelChange)="onSliderChange()">
            <label id="slider-candidate-label">Candidate</label>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>
</div>
