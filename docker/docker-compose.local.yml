# Important
# To deploy this Compose file, set the following environment variables in a `.env` file:
#DATABASE_PASSWORD, DATABASE_USERNAME, DATABASE_ROOT_PASSWORD, DATABASE_NAME
# See the following Docker documentation for details about `.env` files:
# https://docs.docker.com/compose/environment-variables/set-environment-variables/#compose-file

services:
  activemq:
    image: dhi.io/activemq-artemis:2
    container_name: activemq
    restart: always
    ports:
      - 127.0.0.1:8161:8161
      - 127.0.0.1:61616:61616
      - 127.0.0.1:61613:61613
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      ANONYMOUS_LOGIN: false
      EXTRA_ARGS: --http-host 0.0.0.0

  # web:
  #   image: ghcr.io/mitre/iat/iwp-web:26.07
  #   restart: always
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     activemq:
  #       condition: service_started
  #   container_name: web
  #   ports:
  #     - 8080:8080
  #   volumes:
  #     - "./web-component/config:/app/config"
  #   environment:
  #     - DATABASE_HOST=iwp_mysql
  #     - DATABASE_USER=${DATABASE_USERNAME}
  #     - DATABASE_PASSWORD=${DATABASE_PASSWORD}
  #     - DATABASE_NAME=${DATABASE_NAME}
  #     - DATABASE_PORT=3306
  #     - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
  #   env_file: .env
  #   platform: linux/amd64

  iwp-acii:
    image: ghcr.io/mitre/iat/iwp-acii:26.08
    container_name: acii
    restart: always
    depends_on:
      - "activemq"
    volumes:
      - "./acii-component/config/acii.conf.template:/etc/iwp-acii/acii.conf.template:ro"
      - "./acii-component/config/start-acii.sh:/etc/iwp-acii/start-acii.sh:ro"
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
    command: ["sh", "/etc/iwp-acii/start-acii.sh"]

  iwp-biqt:
    image: ghcr.io/mitre/iat/iwp-biqt:26.08
    container_name: biqt
    restart: always
    depends_on:
      - "activemq"
    volumes:
      - "./biqt-component/config:/app/config"
    environment:
      spring.activemq.user: ${ARTEMIS_USER}
      spring.activemq.password: ${ARTEMIS_PASSWORD}
    platform: linux/amd64

  # Iris Annotation via CPU 
  iwp-annotation:
    image: ghcr.io/mitre/iat/iwp-annotation-cpu:26.07
    container_name: annotation
    restart: always
    depends_on:
      - "activemq"
    environment:
      - STOMP_HOST=activemq:61613
      - STOMP_USER=${ARTEMIS_USER}
      - STOMP_PASSWORD=${ARTEMIS_PASSWORD}
      - STOMP_HEARTBEATS=10000,0
    platform: linux/amd64

  # Iris Annotation via GPU 
  # iwp-annotation:
  #   image: ghcr.io/mitre/iat/iwp-annotation-gpu:26.07
  #   container_name: annotation
  #   restart: always
  #   depends_on:
  #     - "activemq"
  #   environment:
  #     - STOMP_HOST=activemq:61613
  #     - STOMP_USER=${ARTEMIS_USER:-artemis}
  #     - STOMP_PASSWORD=${ARTEMIS_PASSWORD}
  #     - STOMP_HEARTBEATS=10000,0
  #   platform: linux/amd64
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  iwp-tshepii:
    image: ghcr.io/mitre/iat/iwp-tshepii:26.07
    container_name: tshepii
    restart: always
    depends_on:
      - "activemq"
    volumes:
      - "./tshepii-component/config/tshepii.conf.template:/etc/iwp-tshepii/tshepii.conf.template:ro"
      - "./tshepii-component/config/start-tshepii.sh:/etc/iwp-tshepii/start-tshepii.sh:ro"
      - "./tshepii-component/config/log4cxx.conf:/etc/iwp-tshepii/log4cxx.conf:ro"
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
    command: ["sh", "/etc/iwp-tshepii/start-tshepii.sh"]
    platform: linux/amd64

  iwp-pdm:
    image: ghcr.io/mitre/iat/iwp-pdm:26.08
    container_name: pdm
    restart: always
    depends_on:
      - "activemq"
    environment:
      STOMP_HOST: activemq:61613
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      STOMP_HEARTBEATS: 10000,0
    platform: linux/amd64

  mysql:
    image: mysql:8
    container_name: iwp_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      # Allows database access without using the root account.
      MYSQL_USER: ${DATABASE_USERNAME}
      # Password for the non-root database account.
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      # Password for root access
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    healthcheck:
      test: mysqladmin ping -h localhost -u $$DATABASE_USERNAME --password=$$DATABASE_PASSWORD
      interval: 1s
      timeout: 1s
      retries: 50
    ports:
      # <Exposed port>: <MySQL port running inside the container>
      - '127.0.0.1:3306:3306'
    expose:
      # Exposes port 3306 within the Docker network.
      - '3306'
    # Persists database data.
    volumes:
      - my-db:/var/lib/mysql
    env_file: .env

volumes:
  my-db:
