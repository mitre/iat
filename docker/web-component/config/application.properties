# ActiveMQ services available
spring.activemq.broker-url=tcp://activemq:61616
server.error.whitelabel.enabled=false

iris.biqtService=true
iris.aciiService=true
iris.dmipaService=false
iris.tshepiiService=true
iris.dualPDMService=true
iris.contactService=true
iris.pdmService=true

iris.aciiQueueRequest=iris.acii.request
iris.aciiQueueResponse=iris.acii.response
iris.biqtQueueRequest=iris.biqt.request
iris.biqtQueueResponse=iris.biqt.response
iris.tshepiiQueueRequest=iris.tshepii.request
iris.tshepiiQueueResponse=iris.tshepii.response
iris.contactQueueResponse=iris.contactdetection.response
iris.irisAnnotationQueueRequest=iris.annotation.request
iris.irisAnnotationQueueResponse=iris.annotation.response
iris.pdmQueueRequest=iris.pdm.request
iris.pdmQueueResponse=iris.pdm.response
iris.dualPDMQueueRequest=iris.dual.pdm.request
iris.dualPDMQueueResponse=iris.dual.pdm.response

iris.aciiServiceName=acii
iris.biqtServiceName=biqt
iris.tshepiiServiceName=tshepii
iris.irisAnnotationServiceName=annotation
iris.dualPDMServiceName=dualpdm
iris.pdmServiceName=pdm


# Services addresses
iris.activeMqAddress=tcp://activemq:61616
iris.iwpWebAddress=http://localhost:8080
iris.activeMqHttpAddress=http://activemq:8161/console/jolokia/read/org.apache.activemq.artemis:broker=*,component=addresses,address=*,subcomponent=queues,*/ConsumerCount,MessagesAdded,MessagesAcknowledged
iris.activeMqUserName=${ARTEMIS_USER}
iris.activeMqPassword=${ARTEMIS_PASSWORD}

#Spring Data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.datasource.url=jdbc:mysql://iwp_mysql:3306/iwp?allowPublicKeyRetrieval=TRUE&useSSL=FALSE
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.name=${DATABASE_NAME}
spring.jpa.show-sql=false
spring.datasource.driverClassName=com.mysql.jdbc.Driver

# Security Options
# Whether the application should respect @Secured annotations and use a login page
iwp.security.secured=false

# The following user-password hashes are encrypted and decrypted at runtime with the configured Jasypt password.
# Use this command to decrypt a value with the standalone Jasypt tool. To encrypt a value, replace `./decrypt.sh` with `./encrypt.sh` and set `input` to the value to encrypt.
# The additional options are required because Spring Jasypt uses these defaults for decryption.
# When encrypting a hash on the command line, escape `$` characters with a `\`.
#./decrypt.sh input="STRINGTODECRYPT" password="$JASYPT_ENCRYPTOR_PASSWORD" algorithm=PBEWITHHMACSHA512ANDAES_256 verbose=true stringOutputType=base64 providerName=SunJCE saltGeneratorClassName=org.jasypt.salt.RandomSaltGenerator ivGeneratorClassName=org.jasypt.iv.RandomIvGenerator
#./encrypt.sh input="STRINGTOENCRYPT" password="$JASYPT_ENCRYPTOR_PASSWORD" algorithm=PBEWITHHMACSHA512ANDAES_256 verbose=true stringOutputType=base64 providerName=SunJCE saltGeneratorClassName=org.jasypt.salt.RandomSaltGenerator ivGeneratorClassName=org.jasypt.iv.RandomIvGenerator

# Download the tools from http://www.jasypt.org/cli.html. If the ZIP download is unavailable, see https://github.com/jasypt/jasypt/releases.

iwp.users.defaultAdminFullName=${DEFAULT_ADMIN_FULL_NAME}
iwp.users.defaultAdminTitle=${DEFAULT_ADMIN_TITLE}
iwp.users.defaultAdminEmail=${DEFAULT_ADMIN_EMAIL}
iwp.users.defaultAdminUsername=${DEFAULT_USER_USERNAME}
iwp.users.defaultAdminPassword=${DEFAULT_USER_PASSWORD}

iwp.users.defaultReviewerFullName=${DEFAULT_REVIEWER_FULL_NAME}
iwp.users.defaultReviewerTitle=${DEFAULT_REVIEWER_TITLE}
iwp.users.defaultReviewerEmail=${DEFAULT_REVIEWER_EMAIL}
iwp.users.defaultReviewerUsername=${DEFAULT_REVIEWER_USERNAME}
iwp.users.defaultReviewerPassword=${DEFAULT_REVIEWER_PASSWORD}

iwp.users.defaultSupervisorFullName=${DEFAULT_SUPERVISOR_FULL_NAME}
iwp.users.defaultSupervisorTitle=${DEFAULT_SUPERVISOR_TITLE}
iwp.users.defaultSupervisorEmail=${DEFAULT_SUPERVISOR_EMAIL}
iwp.users.defaultSupervisorUsername=${DEFAULT_SUPERVISOR_USERNAME}
iwp.users.defaultSupervisorPassword=${DEFAULT_SUPERVISOR_PASSWORD}

# File Uploads
iwp.upload.path=/app/uploads
iwp.image.path=/app/images

