syntax = "proto3";

package org.mitre.iwp.buffers;

message BiqtResponse {
    string imageId = 1;
    int32 contrast = 2;
    int32 irisDiameter = 3;
    int32 percentVisibleIris = 4;
    int32 quality = 5;
    int32 imageHeight = 6;
    int32 imageWidth = 7;
    int32 irisCenterX = 8;
    int32 irisCenterY = 9;
}