syntax = "proto3";

package org.mitre.iwp.buffers;

message AciiServiceResponse {
    string imageId = 1;
    HorizontalAlignment horizontal = 2;
    VerticalAlignment vertical = 3;
}

enum HorizontalAlignment {
    UnknownHorizontal = 0;
    Left = 1;
    Right = 2;
}

enum VerticalAlignment {
    UnknownVertical = 0;
    Up = 1;
    Down = 2;
}